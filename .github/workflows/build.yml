name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cc65
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: rrnet-demo
          path: rrnet-demo.prg
